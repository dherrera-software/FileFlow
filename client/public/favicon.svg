<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- FileFlow Signature Gradient Background -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Subtle Bevel / Highlight Border -->
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#67e8f9" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.7" />
    </linearGradient>

    <!-- Document 1 Corner Fold Gradient -->
    <linearGradient id="fold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Document 2 Corner Fold Gradient -->
    <linearGradient id="fold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Drop Shadow for Documents -->
    <filter id="docShadow" x="-20%" y="-20%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#041f38" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#041f38" flood-opacity="0.22" />
    </filter>

    <!-- Shadow for Flow Arrows -->
    <filter id="arrowShadow" x="-25%" y="-25%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#082f49" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. Squircle App Tile (480x480 with radius 108) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tileBg)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#tileBorder)" stroke-width="4" />

  <!-- Inner Soft Radial Glow at Top-Left -->
  <radialGradient id="topGlow" cx="25%" cy="20%" r="65%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
  </radialGradient>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#topGlow)" pointer-events="none" />

  <!-- 2. Top-Left Document -->
  <!-- Dimensions: w=156, h=190, rx=18. Cut corner at top-right (size: 44) -->
  <g filter="url(#docShadow)">
    <path d="
      M 112 128
      A 18 18 0 0 1 130 110
      L 224 110
      L 268 154
      L 268 282
      A 18 18 0 0 1 250 300
      L 130 300
      A 18 18 0 0 1 112 282
      Z
    " fill="#ffffff" />
    <!-- Folded Flap with gentle curve -->
    <path d="
      M 224 110
      L 224 146
      A 8 8 0 0 0 232 154
      L 268 154
      Z
    " fill="url(#fold1)" />
  </g>

  <!-- 3. Bottom-Right Document -->
  <!-- Shifted: x=232, y=212 -->
  <g filter="url(#docShadow)">
    <path d="
      M 232 230
      A 18 18 0 0 1 250 212
      L 344 212
      L 388 256
      L 388 384
      A 18 18 0 0 1 370 402
      L 250 402
      A 18 18 0 0 1 232 384
      Z
    " fill="#ffffff" />
    <!-- Folded Flap with gentle curve -->
    <path d="
      M 344 212
      L 344 248
      A 8 8 0 0 0 352 256
      L 388 256
      Z
    " fill="url(#fold2)" />
  </g>

  <!-- 4. Top-Right Curved Cycle Arrow (Clockwise Flow: Top-Left to Bottom-Right) -->
  <g filter="url(#arrowShadow)">
    <path d="
      M 294 140
      C 334 136, 368 158, 376 196
    " fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
    <!-- Arrowhead -->
    <path d="
      M 344 198
      L 378 206
      L 392 174
    " fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 5. Bottom-Left Curved Cycle Arrow (Clockwise Flow: Bottom-Right to Top-Left) -->
  <g filter="url(#arrowShadow)">
    <path d="
      M 206 372
      C 166 376, 132 354, 124 316
    " fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
    <!-- Arrowhead -->
    <path d="
      M 156 314
      L 122 306
      L 108 338
    " fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>