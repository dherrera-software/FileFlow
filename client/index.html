<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090a" />
    <meta
      name="description"
      content="FileFlow convierte documentos de texto, imágenes y datos entre TXT, HTML, MD, JPG, PNG, CSV, TSV, JSON y XML. Arrastra un archivo, elige el formato y convierte al instante."
    />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('fileflow-theme');
          var isDark = stored !== 'light';
          if (isDark) document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = isDark ? '#08090a' : '#f5f5f1';
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', isDark ? '#08090a' : '#f5f5f1');
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <title>FileFlow — Tus archivos, en el formato correcto.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
