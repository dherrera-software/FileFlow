services:
  - type: web
    name: fileflow-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://dherrera-software.github.io/FileFlow
      - key: CORS_ORIGINS
        value: https://dherrera-software.github.io,http://localhost:5173
      - key: MAX_FILE_SIZE_MB
        value: 25
      - key: FILE_CLEANUP_MINUTES
        value: 10
