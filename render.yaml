services:
  - type: web
    name: fileflow-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://dherrera-software.github.io/FileFlow
      - key: MAX_FILE_SIZE_MB
        value: 25
      - key: FILE_CLEANUP_MINUTES
        value: 10
